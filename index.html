<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: renderer makes no direct network calls in production.
         connect-src 'none' is intentional; all API calls go through IPC.
         media-src must include app: so <audio> can load files via the custom protocol.
         img-src must include data: for the inline SVG arrow on every <select>; without
         it that request falls back to default-src and is refused, so the dropdowns lose
         their arrow. Only observable in a packaged build, because dev mode is served by
         Vite and bypasses this file.
         A data: image cannot execute script, so this does not widen the script surface. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'none'; media-src 'self' app:" />
    <title>Meeting Transcriber</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
