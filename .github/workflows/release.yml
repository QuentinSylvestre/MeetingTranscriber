name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder can race and create duplicate draft releases for the same tag
      # (see scripts/finalize-github-release.cjs) — clean that up and publish the result.
      - run: node scripts/finalize-github-release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
